<style>
:root { --ink:#17181a; --paper:#f1ede2; --accent:#a8491f; }
* { box-sizing:border-box; }
html, body { margin:0; background:#1f2022; color:var(--ink); }
body { font:15px/1.45 Georgia, "Times New Roman", serif; }
[hidden] { display:none !important; }
#view { position:fixed; inset:0; width:100%; height:100%; display:block; }
#track { height:1500vh; }
.mono { font-family:Consolas, "Courier New", monospace; letter-spacing:.06em; font-size:12px; }
#loader { position:fixed; inset:0; z-index:5; display:grid; place-items:center; padding:24px; text-align:center; background:var(--paper); }
#hero { position:fixed; left:clamp(16px,4vw,48px); bottom:clamp(20px,5vh,48px); max-width:330px; transition:opacity .4s; pointer-events:none; }
#hero p { margin:0; }
#hero.off { opacity:0; }
#caption { position:fixed; left:clamp(16px,4vw,48px); bottom:clamp(20px,5vh,48px); padding:12px 16px 13px; background:rgba(241,237,226,.93); border-left:3px solid var(--accent); opacity:0; transform:translateY(8px); transition:opacity .35s, transform .35s; pointer-events:none; }
#caption.on { opacity:1; transform:none; }
#capName { font-size:clamp(22px,3vw,32px); line-height:1.1; }
#capSize { margin-top:4px; }
#controls { position:fixed; z-index:10; right:clamp(16px,4vw,48px); bottom:clamp(20px,5vh,48px); display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:60vw; }
#controls button { min-height:44px; padding:0 16px; background:var(--ink); color:var(--paper); border:0; border-radius:3px; cursor:pointer; font:13px Consolas, "Courier New", monospace; letter-spacing:.04em; }
#controls button:hover { background:var(--accent); }
#controls button:focus-visible, #rooms button:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
#loadTrack { width:220px; max-width:60vw; height:2px; margin-top:12px; background:rgba(23,24,26,.18); }
#loadBar { height:100%; background:var(--accent); transform:scaleX(0); transform-origin:left; transition:transform .2s; }
#rooms { position:fixed; z-index:10; right:clamp(16px,4vw,48px); top:50%; transform:translateY(-50%); display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
#rooms button { min-height:30px; padding:0 8px; border:0; background:rgba(241,237,226,.72); color:var(--ink); cursor:pointer; font:12px Consolas, "Courier New", monospace; letter-spacing:.03em; opacity:.68; transition:opacity .25s, background .25s, color .25s; }
#rooms button:hover { opacity:1; }
#rooms button.on { opacity:1; background:var(--ink); color:var(--paper); }
#portraitTitle { display:none; margin:0 0 6px; font-weight:400; font-size:30px; line-height:1.1; }
#progressBar { position:fixed; left:0; right:0; top:0; height:3px; }
#progress { height:100%; background:var(--accent); transform:scaleX(0); transform-origin:left; }
#finale { position:fixed; top:clamp(16px,5vh,44px); left:clamp(16px,4vw,48px); max-width:460px; padding:16px 18px; background:rgba(241,237,226,.94); opacity:0; transform:translateY(-8px); transition:opacity .4s, transform .4s; pointer-events:none; }
#finale.on { opacity:1; transform:none; }
#finale h2 { margin:0 0 6px; font-weight:400; font-size:clamp(22px,3vw,30px); line-height:1.15; }
#finale p { margin:0; font-size:14px; }
#controls button.on { background:var(--accent); }
#spots { position:fixed; inset:0; pointer-events:none; z-index:6; }
.spot { position:absolute; left:0; top:0; width:28px; height:28px; margin:-14px 0 0 -14px; border-radius:50%; border:2px solid var(--paper); background:rgba(23,24,26,.62); color:var(--paper); font:600 16px/1 Consolas, "Courier New", monospace; cursor:pointer; pointer-events:auto; display:grid; place-items:center; transition:opacity .25s, transform .25s; box-shadow:0 0 0 0 rgba(241,237,226,.55); animation:pulse 2.4s infinite; }
.spot:hover, .spot:focus-visible { background:var(--accent); outline:none; }
.spot[hidden] { display:none !important; }
@keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(241,237,226,.55); } 70% { box-shadow:0 0 0 10px rgba(241,237,226,0); } 100% { box-shadow:0 0 0 0 rgba(241,237,226,0); } }
@media (prefers-reduced-motion: reduce) { .spot { animation:none; } }
#card { position:fixed; z-index:11; left:clamp(16px,4vw,48px); top:clamp(16px,5vh,44px); max-width:min(360px, calc(100vw - 32px)); padding:14px 16px 15px; background:rgba(241,237,226,.96); border-left:3px solid var(--accent); }
#card h3 { margin:0 0 4px; font-weight:400; font-size:22px; line-height:1.15; }
#card p { margin:0; }
#card button { position:absolute; right:6px; top:6px; width:32px; height:32px; border:0; background:none; color:var(--ink); font-size:18px; cursor:pointer; }
#finishes { position:fixed; z-index:11; right:clamp(16px,4vw,48px); bottom:calc(clamp(20px,5vh,48px) + 56px); width:min(300px, calc(100vw - 32px)); padding:12px 14px 14px; background:rgba(241,237,226,.96); display:grid; gap:10px; }
#finishes .row { display:grid; gap:6px; }
#finishes .swatches { display:flex; gap:8px; flex-wrap:wrap; }
#finishes .swatch { width:34px; height:34px; border-radius:50%; border:2px solid rgba(23,24,26,.25); cursor:pointer; padding:0; }
#finishes .swatch.on { border-color:var(--ink); box-shadow:0 0 0 2px var(--paper) inset; }
#measureLabel { position:fixed; z-index:7; left:0; top:0; padding:4px 8px; background:var(--ink); color:var(--paper); pointer-events:none; transform:translate(-50%,-140%); }
#hint { position:fixed; z-index:6; left:50%; bottom:clamp(20px,5vh,48px); transform:translateX(-50%); padding:6px 10px; background:rgba(241,237,226,.86); pointer-events:none; transition:opacity .4s; }
#hint.off { opacity:0; }
@media (orientation:portrait) { #portraitTitle { display:block; } #caption { bottom:calc(clamp(20px,5vh,48px) + 58px); right:clamp(16px,4vw,48px); } #hero { bottom:calc(clamp(20px,5vh,48px) + 58px); } }
@media (max-width:760px) { #rooms { display:none; } #caption { bottom:auto; top:16px; } #controls { max-width:none; } #hero { bottom:calc(clamp(20px,5vh,48px) + 112px); } #finishes { bottom:calc(clamp(20px,5vh,48px) + 112px); } #hint { bottom:calc(clamp(20px,5vh,48px) + 112px); } #card { top:auto; bottom:calc(clamp(20px,5vh,48px) + 112px); } #controls button { padding:0 12px; } }
@media (max-width:560px) { #hero { max-width:60vw; } #finale p { font-size:13px; } }
</style>

<body>
<div id="loader"><div><div class="mono" id="loadText">MONTANDO O APARTAMENTO</div><div id="loadTrack"><div id="loadBar"></div></div></div></div>
<canvas id="view" aria-label="Modelo 3D do apartamento, conduzido pela rolagem da página"></canvas>
<div id="progressBar"><div id="progress"></div></div>
<div id="hero"><h1 id="portraitTitle">Apartamento 02</h1><p class="mono" id="scrollHint">ROLE PARA ENTRAR NA PLANTA</p></div>
<nav id="rooms" aria-label="Cômodos"></nav>
<div id="caption" aria-live="polite"><div id="capName"></div><div id="capSize" class="mono"></div></div>
<section id="finale">
  <h2 id="finaleTitle">Apartamento 02, cerca de 30 m²</h2>
  <p id="finaleText">Paredes, portas e janelas vêm da planta em PDF. Altura do teto, altura das janelas, móveis, materiais e vista são simulação.</p>
</section>
<div id="spots" aria-hidden="false"></div>
<div id="measureLabel" class="mono" hidden></div>
<div id="hint" class="mono off"></div>
<section id="card" hidden aria-live="polite"><button id="cardClose" type="button" aria-label="Fechar">×</button><h3 id="cardName"></h3><p id="cardInfo" class="mono"></p></section>
<section id="finishes" hidden aria-label="Acabamentos"></section>
<div id="controls"><button id="lang" type="button">EN</button><button id="measure" type="button" aria-pressed="false">Medir</button><button id="finishBtn" type="button" aria-expanded="false">Acabamentos</button><button id="clock" type="button" aria-pressed="false">Ver à noite</button><button id="furnish" type="button" aria-pressed="false">Ver sem móveis</button></div>
<div id="smooth-wrapper"><div id="smooth-content"><div id="track"></div></div></div>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/ScrollSmoother.min.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module" src="src/main.js"></script>

</html>
